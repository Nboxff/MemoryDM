[project]
name = "memory-dm"
version = "0.1.0"
description = "Conversational memory with provenance and semantic forgetting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "faiss-cpu>=1.9,<2",
    "numpy>=2,<3",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "regex>=2024.11,<2027",
    "tiktoken>=0.9,<1",
]

[project.scripts]
memory-dm = "memory_dm.cli:main"
memory-dm-admin = "memory_dm.cli:admin_main"
memory-dm-bemula = "memory_dm.evaluation.bemula:main"
memory-dm-locomo = "memory_dm.evaluation.locomo:main"

[project.optional-dependencies]
eval = ["nltk>=3.9,<4", "tenacity>=8,<10", "tqdm>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_dm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/datasets",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.env.example",
]
